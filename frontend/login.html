<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login — IntelliTransit</title>
    <link rel="stylesheet" href="/css/variables.css">
    <link rel="stylesheet" href="/css/reset.css">
    <link rel="stylesheet" href="/css/base.css">
    <link rel="stylesheet" href="/css/layout.css">
    <link rel="stylesheet" href="/css/components.css">
    <link rel="stylesheet" href="/css/responsive.css">
</head>
<body>
    <nav class="navbar">
        <div class="nav-container">
            <a href="/index.html" class="brand">
                <div class="brand-icon">🚇</div>
                <span>IntelliTransit</span>
            </a>
            <ul id="navbar-links" class="nav-links"></ul>
        </div>
    </nav>

    <main class="container" style="max-width: 460px; margin-top: 40px;">
        <div class="card">
            <h2 style="text-align: center; margin-bottom: 24px;">Welcome Back</h2>
            <form id="login-form">
                <div class="form-group">
                    <label class="form-label" for="email">Email Address</label>
                    <input class="form-input" type="email" id="email" required placeholder="name@example.com">
                </div>
                <div class="form-group">
                    <label class="form-label" for="password">Password</label>
                    <input class="form-input" type="password" id="password" required placeholder="••••••••">
                </div>
                <button type="submit" id="submit-btn" class="btn btn-primary btn-lg" style="width: 100%; margin-top: 8px;">
                    Sign In
                </button>
            </form>
            <p style="text-align: center; margin-top: 20px; font-size: 0.9rem;">
                Don't have an account? <a href="/register.html" style="color: var(--primary); font-weight: 600;">Sign up</a>
            </p>
        </div>
    </main>

    <script type="module">
        import { AuthManager } from "/js/auth.js";
        import { showError } from "/js/utils.js";

        document.getElementById("login-form").addEventListener("submit", async (e) => {
            e.preventDefault();
            const btn = document.getElementById("submit-btn");
            btn.disabled = true;
            btn.textContent = "Signing in...";

            const email = document.getElementById("email").value;
            const password = document.getElementById("password").value;

            try {
                await AuthManager.login(email, password);
                setTimeout(() => {
                    window.location.href = "/planner.html";
                }, 400);
            } catch {
                btn.disabled = false;
                btn.textContent = "Sign In";
            }
        });
    </script>
</body>
</html>
