<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Account — IntelliTransit</title>
    <link rel="stylesheet" href="/css/variables.css">
    <link rel="stylesheet" href="/css/reset.css">
    <link rel="stylesheet" href="/css/base.css">
    <link rel="stylesheet" href="/css/layout.css">
    <link rel="stylesheet" href="/css/components.css">
    <link rel="stylesheet" href="/css/responsive.css">
</head>
<body>
    <nav class="navbar">
        <div class="nav-container">
            <a href="/index.html" class="brand">
                <div class="brand-icon">🚇</div>
                <span>IntelliTransit</span>
            </a>
            <ul id="navbar-links" class="nav-links"></ul>
        </div>
    </nav>

    <main class="container" style="max-width: 480px; margin-top: 30px;">
        <div class="card">
            <h2 style="text-align: center; margin-bottom: 24px;">Create an Account</h2>
            <form id="register-form">
                <div class="form-group">
                    <label class="form-label" for="full_name">Full Name</label>
                    <input class="form-input" type="text" id="full_name" required placeholder="e.g. Manas Sharma">
                </div>
                <div class="form-group">
                    <label class="form-label" for="email">Email Address</label>
                    <input class="form-input" type="email" id="email" required placeholder="name@example.com">
                </div>
                <div class="form-group">
                    <label class="form-label" for="phone">Phone Number (Optional)</label>
                    <input class="form-input" type="tel" id="phone" placeholder="9876543210">
                </div>
                <div class="form-group">
                    <label class="form-label" for="password">Password (min. 8 characters)</label>
                    <input class="form-input" type="password" id="password" required minlength="8" placeholder="••••••••">
                </div>
                <button type="submit" id="submit-btn" class="btn btn-primary btn-lg" style="width: 100%; margin-top: 8px;">
                    Register & Continue
                </button>
            </form>
            <p style="text-align: center; margin-top: 20px; font-size: 0.9rem;">
                Already registered? <a href="/login.html" style="color: var(--primary); font-weight: 600;">Sign in</a>
            </p>
        </div>
    </main>

    <script type="module">
        import { AuthManager } from "/js/auth.js";

        document.getElementById("register-form").addEventListener("submit", async (e) => {
            e.preventDefault();
            const btn = document.getElementById("submit-btn");
            btn.disabled = true;
            btn.textContent = "Creating account...";

            const fullName = document.getElementById("full_name").value;
            const email = document.getElementById("email").value;
            const phone = document.getElementById("phone").value;
            const password = document.getElementById("password").value;

            try {
                await AuthManager.register(fullName, email, password, phone);
                setTimeout(() => {
                    window.location.href = "/planner.html";
                }, 400);
            } catch {
                btn.disabled = false;
                btn.textContent = "Register & Continue";
            }
        });
    </script>
</body>
</html>
